<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title> Memories ♡</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<section
    class="content-section memories-section"
    style="min-height:100vh;"
>

    <div class="section-label">
        02 ·  LITTLE HISTORY
    </div>


    <div class="memory-heading reveal visible">

        <span>
             MEMORIES 
        </span>

        <h3>
            All the little moments<br>
            
        </h3>

    </div>


    <div class="memory-grid">

        <button class="memory reveal visible">

            <img
                src="assets/photo1.jpeg"
                alt="Memory 1"
            >

            <span>
                memory one
            </span>

        </button>


        <button class="memory reveal visible">

            <img
                src="assets/photo2.jpeg"
                alt="Memory 2"
            >

            <span>
                memory two
            </span>

        </button>


        <button class="memory reveal visible">

            <img
                src="assets/photo3.jpeg"
                alt="Memory 3"
            >

            <span>
                memory three
            </span>

        </button>


        <button class="memory reveal visible">

            <img
                src="assets/photo4.jpeg"
                alt="Memory 4"
            >

            <span>
                memory four
            </span>

        </button>


        <button class="memory reveal visible">

            <img
                src="assets/photo5..jpeg"
                alt="Memory 5"
            >

            <span>
                memory five
            </span>

        </button>


        <button class="memory reveal visible">

            <img
                src="assets/photo6.jpeg"
                alt="Memory 6"
            >

            <span>
                memory six
            </span>

        </button>


        <button class="memory reveal visible">
<video
    src="assets/photo7.mp4"
    autoplay
    muted
    loop
    playsinline
></video>

            <span>
                memory seven
            </span>

        </button>


        <button class="memory reveal visible">

            <video
    src="assets/photo8.mp4"
    autoplay
    muted
    loop
    playsinline
></video>

            <span>
                memory eight
            </span>

        </button>


        <button class="memory reveal visible">
<video
    src="assets/photo9.mp4"
    autoplay
    muted
    loop
    playsinline
></video>

            <span>
                memory nine
            </span>

        </button>

    </div>


    <div class="back-top">
<button id="backTop">
        ↑ BACK TO THE THREE DOORS
    </button>

    </div>

</section>


<div
    id="lightbox"
    class="lightbox hidden"
>

    <button id="closeLightbox">
        ×
    </button>

    <img
        id="lightboxImg"
        src=""
        alt=""
    >

</div>


<script src="script.js"></script>

</body>
</html>
